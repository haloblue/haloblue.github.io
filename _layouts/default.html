<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title }} — {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
<meta name="description" content="{{ page.excerpt | default: site.description | strip_html | normalize_whitespace | truncate: 160 }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Serif:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ '/assets/main.css' | relative_url }}">
<link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
<link rel="icon" type="image/svg+xml" href="{{ '/assets/favicon.svg' | relative_url }}">
</head>
<body>
<header class="site-header">
  <div class="prompt-line">
    <img class="site-logo" src="{{ '/assets/logo.svg' | relative_url }}" alt="" width="46" height="46">
    <a class="prompt" href="{{ '/' | relative_url }}">haloblue<span class="prompt-colon">:</span><span class="prompt-path">~</span><span class="prompt-dollar">$</span></a><span class="cursor" aria-hidden="true"></span>
  </div>
  <nav class="site-nav">
    <a href="{{ '/' | relative_url }}">posts</a>
    <a href="{{ '/about/' | relative_url }}">about</a>
    <a href="{{ '/feed.xml' | relative_url }}">rss</a>
  </nav>
</header>
<main>
{{ content }}
</main>
<footer class="site-footer">
  <span class="dim">© {{ site.time | date: "%Y" }} haloblue · <a href="https://github.com/haloblue">github.com/haloblue</a></span>
</footer>
</body>
</html>
