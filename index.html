---
layout: default
---
<p class="intro">Notes on security, systems, and the societies built on top of them. Written slowly, in no particular order.</p>

<section class="listing" aria-label="Posts">
  <p class="listing-cmd dim">ls -lt ~/posts</p>
  <ul class="post-list">
    {% for post in site.posts %}
    <li>
      <time class="dim" datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: "%Y-%m-%d" }}</time>
      <a href="{{ post.url | relative_url }}">{{ post.title }}</a>
    </li>
    {% endfor %}
  </ul>
</section>
